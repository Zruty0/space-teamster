<!doctype html>
<meta charset="utf-8"><title>Thule desktop check</title>
<style>body{margin:12px;background:#030611;color:#9ce;font:14px monospace}canvas{display:block}select{background:#102030;color:#def;padding:6px}#status{margin-left:16px}</style>
<select id="view"></select><span id="status">Checking live worker…</span><canvas id="screen" width="1280" height="800"></canvas>
<script type="module">
import {Game} from '/src/game.ts';
import {defaultCareerProfile,TEAMSTER_CERTIFICATION_IDS} from '/src/career-state.ts';
import {drawInteractiveScene} from '/src/interactive-scene.ts';
import {defaultNunesInquirySnapshot} from '/src/content/estella/faction-contracts/nunes-inquiries.ts';
import {ESTELLA_NODES_BY_ID} from '/src/content/estella/index.ts';
import {THULE_SITES,retiredThuleLegacyOrder} from '/src/content/estella/thule-sites.ts';
import {BARATARIA_OBSERVATORY,BARATARIA_SURFACE_SITES} from '/src/content/estella/barataria-sites.ts';
import {contractLocationId} from '/src/contract-presentation.ts';
import {canTravelEmpty} from '/src/empty-runs.ts';
const siteIds=[...THULE_SITES,BARATARIA_OBSERVATORY],sites=Object.fromEntries(siteIds.map(id=>[ESTELLA_NODES_BY_ID.get(id).name,id]));
const jobs=['Community supplies','Household passage','Local water','Observatory instruments','Observatory observers'];
const menu=document.getElementById('view'),canvas=document.getElementById('screen'),ctx=canvas.getContext('2d'),contracts={};
for(const name of [...Object.keys(sites),...jobs]){const o=document.createElement('option');o.value=name;o.textContent=name;menu.append(o);}
const game=Object.create(Game.prototype);game.career={...defaultCareerProfile(),certifications:[...TEAMSTER_CERTIFICATION_IDS]};game.canvas=canvas;
function show(){canvas.width=innerWidth-24;canvas.height=innerHeight-60;const key=menu.value,c=contracts[key];if(key in sites){game.career.locationId=sites[key];drawInteractiveScene(ctx,canvas,game.buildInteractiveScene({id:'stationTerminal',selectedIndex:0}),0);}else if(c){game.career.locationId=c.sourceId;drawInteractiveScene(ctx,canvas,game.buildInteractiveScene({id:'contractPosting',contracts:[c],contractIndex:0,selectedIndex:0}),0);}}
menu.onchange=show;window.addEventListener('resize',show);menu.value='Common Ground';show();
const sources=[...siteIds,'estella-iv-primary-city','estella-iv-main-orbital-station','caravanserai-main-commercial-dock','estella-xid-main-port'];
const requests=[];for(let day=0;day<24;day++)for(const sourceId of sources)requests.push({sourceId,worldTime:day*86400});
let complete=0,rowsSeen=0,newRows=0;const started=performance.now(),worker=new Worker(new URL('../src/contract-board-worker.ts',import.meta.url),{type:'module'});
function fail(message){document.title='FAIL — Thule';document.getElementById('status').textContent=message;worker.terminate();}
worker.onerror=e=>fail(e.message);
worker.onmessage=({data})=>{try{
 if(data.error)throw Error(data.error);const rows=[...data.boards.freight,...data.boards.passenger];rowsSeen+=rows.length;
 for(const c of rows){
  if(retiredThuleLegacyOrder(c))throw Error('retired custody/research job');
  if([c.sourceId,c.destinationId].some(id=>BARATARIA_SURFACE_SITES.includes(id)))throw Error('public surface smuggling work');
  if(contractLocationId(c.sourceId)!==contractLocationId(requests[complete].sourceId)||c.quote.sourceId!==c.sourceId||c.quote.destinationId!==c.destinationId)throw Error('quote/source mismatch');
  if(c.sourceName!==ESTELLA_NODES_BY_ID.get(contractLocationId(c.sourceId))?.name||c.destinationName!==ESTELLA_NODES_BY_ID.get(contractLocationId(c.destinationId))?.name)throw Error('physical name mismatch');
  if(!/^(thule|barataria):/.test(c.templateId??''))continue;newRows++;
  if(c.factionId==='estella-government'&&c.category==='freight')contracts['Community supplies']??=c;
  if(c.templateId.startsWith('thule:')&&c.category==='passenger')contracts['Household passage']??=c;
  if(c.templateId==='thule:local-ice:out')contracts['Local water']??=c;
  if(c.templateId.startsWith('barataria:observatory-instruments:'))contracts['Observatory instruments']??=c;
  if(c.templateId.startsWith('barataria:observer-visits:'))contracts['Observatory observers']??=c;
 }
 complete++;if(complete<requests.length){worker.postMessage({requestId:complete,...requests[complete],nunesInquiries:defaultNunesInquirySnapshot(requests[complete].worldTime)});return;}
 worker.terminate();for(const key of jobs)if(!contracts[key])throw Error(`missing live posting: ${key}`);
 const visitor={...game.career,locationId:'caravanserai-main-commercial-dock'};
 if(siteIds.some(id=>!canTravelEmpty(visitor,id))||BARATARIA_SURFACE_SITES.some(id=>canTravelEmpty(visitor,id)))throw Error('wrong public/hidden access');
 for(const o of menu.options){menu.value=o.value;show();}menu.value='Common Ground';show();document.title='PASS — Thule';document.getElementById('status').textContent=`PASS — ${complete} requests; ${rowsSeen} postings (${newRows} new); seven terminals + five job views; ${(performance.now()-started).toFixed(0)} ms`;
}catch(e){fail(e.stack??String(e));}};
worker.postMessage({requestId:0,...requests[0],nunesInquiries:defaultNunesInquirySnapshot(0)});
// Synthetic profile only: no Game constructor, live save loading or writes.
</script>
