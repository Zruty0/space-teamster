<!doctype html>
<meta charset="utf-8"><title>Elite maintenance checks</title>
<style>body{margin:12px;background:#030611;color:#9ce;font:14px monospace}canvas{display:block}select{max-width:65vw;background:#102030;color:#def;padding:6px}#status{margin-left:12px}</style>
<select id="view"></select><span id="status">Synthetic profiles only.</span><canvas id="screen" width="1280" height="800"></canvas>
<script type="module">
const storage=new Map();let writes=0,fail=false;
Object.defineProperty(window,'localStorage',{value:{getItem:k=>storage.get(k)??null,setItem:(k,v)=>{if(fail)throw Error('blocked synthetic save');storage.set(k,v);writes++;},removeItem:k=>storage.delete(k)}});
const {Game}=await import('/src/game.ts');
const {defaultCareerProfile,TEAMSTER_CERTIFICATION_IDS}=await import('/src/career-state.ts');
const {MAINTENANCE_SHOPS,diagnosisQuote,rigServiceQuote,repairQuote,replacementQuote}=await import('/src/maintenance/shops.ts');
const {equipmentQuote}=await import('/src/maintenance/equipment.ts');
const {createDefaultRigState,deriveRestrictions}=await import('/src/maintenance/rig-state.ts');
const {MAINTENANCE_COMPONENTS,componentFaults}=await import('/src/maintenance/catalog.ts');
const {physicalTerminalId,localTerminalScopeIds}=await import('/src/physical-terminals.ts');
const {emptyTravelAccess}=await import('/src/content/estella/empty-travel-access.ts');
const {canonicalEstellaLocationId}=await import('/src/content/estella/location-aliases.ts');
const {drawInteractiveScene}=await import('/src/interactive-scene.ts');
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d'),menu=document.getElementById('view');
const branches=MAINTENANCE_SHOPS.filter(s=>s.facilityTier===3),views={};
for(const s of branches)for(const mode of ['profile','diagnosis','service','serviced','repairs','repaired','total','equipment','installed','recovered','failed save'])views[s.name+' — '+mode]=[s.id,mode];
views['Richelieu directions']=['maintenance-estella-iii-main-customs-station','directions'];
views['Roadstead directions']=['maintenance-estella-v-transit-station','directions'];
for(const key of Object.keys(views)){const o=document.createElement('option');o.value=key;o.textContent=key;menu.append(o);}
const game=Object.create(Game.prototype);game.canvas=canvas;game.worldTime=0;game.showGuidance=t=>document.getElementById('status').textContent=t;
let current,checks=0;
function assert(v,m){checks++;if(!v)throw Error(m);}
function draw(){canvas.width=innerWidth-24;canvas.height=innerHeight-65;const state=game.phase.scene;current=game.buildInteractiveScene(state);drawInteractiveScene(ctx,canvas,current,state.selectedIndex??0,state.bodyScrollOffset??0);}
function show(){
 document.getElementById('status').textContent='Synthetic profile — '+menu.value;
 const [id,mode]=views[menu.value],shop=MAINTENANCE_SHOPS.find(s=>s.id===id);
 assert(shop,'selected shop exists');
 const arrival=localTerminalScopeIds(physicalTerminalId(shop.locationIds[0])).find(poi=>canonicalEstellaLocationId(poi)===poi&&emptyTravelAccess(poi)==='public');
 assert(arrival,'public operational entrance');
 game.career={...defaultCareerProfile(),locationId:arrival,money:10000000,certifications:[...TEAMSTER_CERTIFICATION_IDS],rig:createDefaultRigState(!['equipment','installed'].includes(mode))};game.worldTime=0;
 game.phase={kind:'interactiveScene',scene:{id:'maintenanceShop',selectedIndex:0,maintenanceShopId:id}};
 const action=value=>game.activateInteractiveSceneOption({},value),before=writes;
 const c=MAINTENANCE_COMPONENTS.find(c=>componentFaults(c).some(f=>f.workGrade==='A'));
 const fault=componentFaults(c).find(f=>f.workGrade==='A');
 if(['diagnosis','repairs','repaired','failed save'].includes(mode)){
  game.career.rig.components[c.id].hp=1;
  game.career.rig.components[c.id].fault={severity:fault.severity,faultId:fault.id,diagnosis:'unknown',generatedMission:0,generatedStrike:0};
 }
 if(['service','serviced'].includes(mode))for(const state of Object.values(game.career.rig.components))state.ap=0;
 if(mode==='total'){const s=game.career.rig.components[c.id];s.hp=0;s.fault={severity:'total',diagnosis:'unknown',generatedMission:0,generatedStrike:0};}
 if(['diagnosis','repairs','repaired','failed save','service','serviced','total'].includes(mode)){
  action(`maintenanceDiagnose:${id}`);assert(writes===before+1&&game.career.money===10000000-diagnosisQuote(shop).credits,'real paid inspection');
 }
 if(mode==='directions'){action(`maintenanceReferral:${id}`);assert(writes===before,'free advice without inspection');}
 if(mode==='equipment')game.phase.scene.id='equipmentList';
 if(mode==='installed'){
  const grade=shop.componentGradeBest,q=equipmentQuote(game.career.rig,shop,'atmospheric-package',grade);
  action(`equipmentBuy:${id}:atmospheric-package:${grade}`);
  assert(game.career.money===10000000-q.credits&&writes===before+1,'real equipment purchase');
  assert(q.componentIds.every(cid=>game.career.rig.components[cid].grade===grade),'stocked grade actually installed');
 }
 if(mode==='service')action(`maintenanceServiceList:${id}`);
 if(mode==='repairs'){action(`maintenanceFaults:${id}`);assert(game.career.rig.components[c.id].fault.diagnosis==='confirmed','A-only fault identified');}
 if(mode==='total'){
  assert(!repairQuote(game.career.rig,shop,c.id)&&replacementQuote(game.career.rig,shop,c.id),'Total only replaceable');
  game.phase.scene={id:'maintenanceComponent',selectedIndex:0,maintenanceShopId:id,maintenanceComponentId:c.id};
 }
 if(mode==='repaired'||mode==='failed save'){
  const q=repairQuote(game.career.rig,shop,c.id),credit=diagnosisQuote(shop).credits;
  assert(q,'A repair available');
  const cash=game.career.money,time=game.career.worldTime,original=JSON.stringify(game.career),count=writes;
  fail=mode==='failed save';action(`maintenanceWork:${id}:${c.id}:repair`);fail=false;
  if(mode==='failed save')assert(JSON.stringify(game.career)===original&&writes===count&&game.worldTime===time,'failed repair preserves profile and time');
  else{
   assert(!game.career.rig.components[c.id].fault&&game.career.money===cash-Math.max(0,q.credits-credit),'A repair and one-use credit');
   assert(Math.abs(game.career.worldTime-time-q.laborHours*3600)<1e-7,'exact repair time');
  }
 }
 if(mode==='serviced'){
  const q=rigServiceQuote(game.career.rig,shop),dq=diagnosisQuote(shop);action(`maintenanceServiceAll:${id}`);
  assert(game.career.money===10000000-q.credits&&game.career.maintenanceShopInspections[id].creditRemaining===0,'service charge and credit');
  assert(Math.abs(game.career.worldTime-(dq.laborHours+q.laborHours)*3600)<1e-7,'service time');
 }
 if(mode==='recovered'){
  const s=game.career.rig.components['powertrain-main-drive-core'];s.hp=0;s.ap=0;s.fault={severity:'total',diagnosis:'unknown',generatedMission:0,generatedStrike:0};game.career.money=-1000;
  action(`maintenanceEmergency:${id}`);
  assert(!deriveRestrictions(game.career.rig).some(r=>r.id==='grounded')&&game.career.money===-1000&&game.career.worldTime===0,'free grounded-only restart');
 }
 draw();assert(!/\btier\s*-?\d|facilityTier|\bS[0123]\b|\bW0\b/.test(JSON.stringify(current)),'internal classes hidden');
 if(mode==='profile')assert(!current.options.some(o=>o.action.startsWith('maintenanceReferral:'))&&writes===before,'elite profile has no higher referral and does not save');
 if(mode==='directions')assert(JSON.stringify(current).includes(id.includes('iii')?'Atelier du Méridien':'SSC Reconstruction Works'),'active elite destination named');
}
menu.onchange=show;window.addEventListener('resize',draw);
window.addEventListener('keydown',e=>{
 if(document.activeElement===menu)return;const state=game.phase.scene;
 if(['ArrowDown','ArrowUp','Enter',' ','PageDown','PageUp'].includes(e.key))e.preventDefault();
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){state.selectedIndex=(state.selectedIndex+(e.key==='ArrowDown'?1:-1)+current.options.length)%current.options.length;draw();}
 if(e.key==='PageDown'||e.key==='PageUp'){state.bodyScrollOffset=Math.max(0,(state.bodyScrollOffset??0)+(e.key==='PageDown'?120:-120));draw();}
 if(e.key==='Enter'||e.key===' '){const o=current.options[state.selectedIndex];if(o&&!o.disabled){if(/^(maintenance|equipment)/.test(o.action)){game.activateInteractiveSceneOption({},o.action);draw();}else game.showGuidance('Use the selector for another synthetic shop.');}}
});
canvas.addEventListener('pointerdown',()=>document.activeElement?.blur());
try{assert(branches.length===4,'four final elite landmarks');for(const key of Object.keys(views)){menu.value=key;show();}menu.value='Atelier du Méridien — profile';show();document.title='PASS — Elite maintenance';document.getElementById('status').textContent=`PASS — ${checks} checks; all four elites. Click canvas: arrows/Enter, Page Up/Down. Synthetic saves only.`;}catch(e){document.title='FAIL — Elite maintenance';document.getElementById('status').textContent=e.stack??String(e);throw e;}
</script>
