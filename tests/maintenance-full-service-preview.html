<!doctype html>
<meta charset="utf-8"><title>Full-service checks</title>
<style>body{margin:12px;background:#030611;color:#9ce;font:14px monospace}canvas{display:block}select{max-width:65vw;background:#102030;color:#def;padding:6px}#status{margin-left:12px}</style>
<select id="view"></select><span id="status">Synthetic profiles only.</span><canvas id="screen" width="1280" height="800"></canvas>
<script type="module">
const storage=new Map();let writes=0;
Object.defineProperty(window,'localStorage',{value:{getItem:k=>storage.get(k)??null,setItem:(k,v)=>{storage.set(k,v);writes++;},removeItem:k=>storage.delete(k)}});
const {Game}=await import('/src/game.ts');
const {defaultCareerProfile,TEAMSTER_CERTIFICATION_IDS}=await import('/src/career-state.ts');
const {MAINTENANCE_SHOPS,diagnosisQuote,rigServiceQuote,repairQuote}=await import('/src/maintenance/shops.ts');
const {FULL_SERVICE_COPY}=await import('/src/maintenance/full-service-copy.ts');
const {createDefaultRigState}=await import('/src/maintenance/rig-state.ts');
const {MAINTENANCE_COMPONENTS,componentFaults}=await import('/src/maintenance/catalog.ts');
const {physicalTerminalId,localTerminalScopeIds}=await import('/src/physical-terminals.ts');
const {emptyTravelAccess}=await import('/src/content/estella/empty-travel-access.ts');
const {canonicalEstellaLocationId}=await import('/src/content/estella/location-aliases.ts');
const {ESTELLA_NODES_BY_ID}=await import('/src/content/estella/index.ts');
const {drawInteractiveScene}=await import('/src/interactive-scene.ts');
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d'),menu=document.getElementById('view');
const at=name=>MAINTENANCE_SHOPS.find(s=>ESTELLA_NODES_BY_ID.get(physicalTerminalId(s.locationIds[0])).name===name).id;
const branches=MAINTENANCE_SHOPS.filter(s=>FULL_SERVICE_COPY[physicalTerminalId(s.locationIds[0])]||s.id==='vilar-cadiz-highport-outfitter');
const views={
 'Balor':[at('Balor Orbital'),'profile'],'Acheron':[at('Acheron Commercial Hub'),'profile'],'Fuyuan':[at('Fuyuan'),'profile'],
 'Perun':[at('Perun City'),'profile'],'Bir Safa':[at('Bir Safa'),'profile'],'Coldgate':[at('Coldgate'),'profile'],
 'Cadiz':[at('Cadiz Highport'),'profile'],'Directions':[at('The Caravanserai'),'directions'],
 'Diagnosis':[at('The Caravanserai'),'diagnosis'],'B repair':[at('The Caravanserai'),'repaired'],
 'A-only fault':[at('The Caravanserai'),'unknown'],'Service receipt':[at('The Caravanserai'),'serviced'],
 'Equipment':[at('The Caravanserai'),'equipment'],
};
for(const s of branches)for(const mode of ['profile','diagnosis','service','repairs','directions','equipment'])views[s.id+' '+mode]=[s.id,mode];
for(const [key,[id,mode]] of Object.entries(views)){const o=document.createElement('option');o.value=key;const s=MAINTENANCE_SHOPS.find(s=>s.id===id);o.textContent=key.startsWith(id)?s.name+' — '+mode:key;menu.append(o);}
const game=Object.create(Game.prototype);game.canvas=canvas;game.worldTime=0;game.showGuidance=t=>document.getElementById('status').textContent=t;
let current,checks=0;
function assert(v,m){checks++;if(!v)throw Error(m);}
function draw(){canvas.width=innerWidth-24;canvas.height=innerHeight-65;const state=game.phase.scene;current=game.buildInteractiveScene(state);drawInteractiveScene(ctx,canvas,current,state.selectedIndex??0,state.bodyScrollOffset??0);}
function show(){
 const [id,mode]=views[menu.value],shop=MAINTENANCE_SHOPS.find(s=>s.id===id);
 const arrival=localTerminalScopeIds(physicalTerminalId(shop.locationIds[0])).find(id=>canonicalEstellaLocationId(id)===id&&emptyTravelAccess(id)==='public')??shop.locationIds[0];
 game.career={...defaultCareerProfile(),locationId:arrival,money:1000000,certifications:[...TEAMSTER_CERTIFICATION_IDS],rig:createDefaultRigState(mode!=='equipment')};game.worldTime=0;
 game.phase={kind:'interactiveScene',scene:{id:'maintenanceShop',selectedIndex:0,maintenanceShopId:id}};
 const action=value=>game.activateInteractiveSceneOption({},value),before=writes;
 const grade=mode==='unknown'?'A':'B';
 const c=MAINTENANCE_COMPONENTS.find(c=>componentFaults(c).some(f=>f.workGrade===grade));
 const fault=componentFaults(c).find(f=>f.workGrade===grade);
 if(['diagnosis','repairs','repaired','unknown'].includes(mode)){
  game.career.rig.components[c.id].hp=fault.severity==='minor'?c.minorThreshold:1;
  game.career.rig.components[c.id].fault={severity:fault.severity,faultId:fault.id,diagnosis:'unknown',generatedMission:0,generatedStrike:0};
 }
 if(['service','serviced'].includes(mode))for(const state of Object.values(game.career.rig.components))state.ap=0;
 if(['diagnosis','repairs','repaired','unknown','service','serviced'].includes(mode)){
  const quote=diagnosisQuote(shop);action(`maintenanceDiagnose:${id}`);
  assert(writes===before+1&&game.career.money===1000000-quote.credits,'real inspection payment');
 }
 if(mode==='directions'){action(`maintenanceReferral:${id}`);assert(writes===before,'free advice before inspection');}
 if(mode==='equipment')game.phase.scene.id='equipmentList';
 if(mode==='service'){action(`maintenanceServiceList:${id}`);}
 if(mode==='repairs'){action(`maintenanceFaults:${id}`);assert(game.career.rig.components[c.id].fault.diagnosis==='confirmed','B fault identified');}
 if(mode==='unknown'){game.phase.scene={id:'maintenanceComponent',selectedIndex:0,maintenanceShopId:id,maintenanceComponentId:c.id};assert(game.career.rig.components[c.id].fault.diagnosis==='suspected','A-only fault not identified');}
 if(mode==='repaired'){
  const quote=repairQuote(game.career.rig,shop,c.id),credit=diagnosisQuote(shop).credits;
  const cash=game.career.money,time=game.career.worldTime;assert(quote,'B repair available');
  action(`maintenanceWork:${id}:${c.id}:repair`);
  assert(!game.career.rig.components[c.id].fault&&game.career.money===cash-Math.max(0,quote.credits-credit),'real B repair and credit');
  assert(Math.abs(game.career.worldTime-time-quote.laborHours*3600)<1e-7,'quoted B repair time');
 }
 if(mode==='serviced'){
  const quote=rigServiceQuote(game.career.rig,shop),dq=diagnosisQuote(shop);action(`maintenanceServiceAll:${id}`);
  assert(game.career.money===1000000-quote.credits&&game.career.maintenanceShopInspections[id].creditRemaining===0,'real service and one-use credit');
  assert(Math.abs(game.career.worldTime-(dq.laborHours+quote.laborHours)*3600)<1e-7,'quoted service time');
 }
 draw();assert(!/\btier\s*-?\d|facilityTier|\bS[0123]\b|\bW0\b/.test(JSON.stringify(current)),'internal classes hidden');
 if(mode==='unknown')assert(!JSON.stringify(current).includes(fault.name),'A-only diagnosis stays hidden');
 if(mode==='directions')assert(!/\[person\]|\{name\}/.test(JSON.stringify(current)),'referral markup/substitution resolved');
}
menu.onchange=show;window.addEventListener('resize',draw);
window.addEventListener('keydown',e=>{
 if(document.activeElement===menu)return;const state=game.phase.scene;
 if(['ArrowDown','ArrowUp','Enter',' ','PageDown','PageUp'].includes(e.key))e.preventDefault();
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){state.selectedIndex=(state.selectedIndex+(e.key==='ArrowDown'?1:-1)+current.options.length)%current.options.length;draw();}
 if(e.key==='PageDown'||e.key==='PageUp'){state.bodyScrollOffset=Math.max(0,(state.bodyScrollOffset??0)+(e.key==='PageDown'?120:-120));draw();}
 if(e.key==='Enter'||e.key===' '){const o=current.options[state.selectedIndex];if(o&&!o.disabled){if(/^(maintenance|equipment)/.test(o.action)){game.activateInteractiveSceneOption({},o.action);draw();}else game.showGuidance('Use the selector for another synthetic shop.');}}
});
canvas.addEventListener('pointerdown',()=>document.activeElement?.blur());
try{assert(branches.length===25,'exact upgrade roster');for(const key of Object.keys(views)){menu.value=key;show();}menu.value='Balor';show();document.title='PASS — Full-service workshops';document.getElementById('status').textContent=`PASS — ${checks} checks; 25 branches, all shop passages. Click canvas: arrows/Enter, Page Up/Down. Synthetic saves.`;}catch(e){document.title='FAIL — Full-service workshops';document.getElementById('status').textContent=e.stack??String(e);throw e;}
</script>
