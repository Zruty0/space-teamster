<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Teamster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
    #dev-panel {
      display: none;
      position: fixed;
      inset: 10px 10px auto auto;
      width: min(1180px, calc(100vw - 20px));
      max-height: calc(100vh - 20px);
      overflow: auto;
      background: rgba(0, 12, 8, 0.96);
      border: 1px solid #0a8;
      box-shadow: 0 0 24px #000;
      color: #bfffe8;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 10px;
      z-index: 100;
    }
    #dev-panel h2 { color: #0fc; margin: 0; font-size: 14px; }
    #dev-panel h3 { color: #0fc; margin: 12px 0 4px; font-size: 12px; }
    #dev-panel button, #dev-panel select {
      background: #031c16; border: 1px solid #087; color: #bfffe8;
      padding: 5px 10px; cursor: pointer; font-family: inherit;
    }
    #dev-panel button:hover, #dev-panel button.active { background: #075; color: #fff; }
    #dev-panel table { width: 100%; min-width: 1040px; border-collapse: collapse; table-layout: auto; }
    #dev-panel table.dev-compact { min-width: 420px; }
    #dev-panel .dev-table-scroll { overflow-x: auto; }
    #dev-panel th, #dev-panel td { padding: 4px 6px; border: 1px solid #16483c; vertical-align: top; text-align: left; }
    #dev-panel th { position: sticky; top: 0; background: #06271f; color: #5fffd2; }
    #dev-panel td small { display: block; color: #78a99b; white-space: normal; margin-top: 2px; }
    #dev-panel ul { margin: 3px 0 3px 18px; }
    #dev-panel .dev-panel-header { display: flex; justify-content: space-between; align-items: center; color: #78a99b; }
    #dev-panel .dev-tabs { display: flex; gap: 6px; margin: 8px 0; position: sticky; top: -10px; background: #000c08; padding: 8px 0; z-index: 3; }
    #dev-panel .dev-system { overflow-x: auto; }
    #dev-panel .dev-status { padding: 1px 5px; border: 1px solid currentColor; font-size: 10px; }
    #dev-panel .dev-ok, #dev-panel .dev-ok.dev-status { color: #53ff9a; }
    #dev-panel .dev-warning { color: #ffd45a; }
    #dev-panel .dev-alert { color: #ff6262; }
    #dev-panel .dev-absent { color: #789; }
    #dev-panel .dev-summary { border: 1px solid #16483c; background: #031914; padding: 7px; line-height: 1.45; }
    #dev-panel .dev-ledger-select { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    #dev-panel .dev-ledger-select select { min-width: min(700px, 80vw); }
    @media (max-width: 700px) {
      #dev-panel { inset: 0; width: 100vw; max-height: 100vh; border-width: 0; }
      #dev-panel .dev-tabs { top: -10px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="dev-panel"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
